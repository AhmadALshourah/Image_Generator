# Tool configuration for the backend.
# Dependencies live in requirements.txt / requirements-dev.txt; this file
# only carries opinionated linter / formatter / test settings.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "__pycache__", "images"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "W",    # pycodestyle warnings
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "C4",   # comprehensions
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line-too-long — handled by the formatter
    "B008",  # function call in default arg — FastAPI's Depends() needs this
    "B904",  # raise ... from — we do this idiomatically in error handlers
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]  # fixtures look like unused imports / redefinitions

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
