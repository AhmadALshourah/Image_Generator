server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reverse-proxy the API to the backend container.
    # gpt-image-1 can take 30s+, so be generous with timeouts.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
        send_timeout          180s;

        client_max_body_size 25M;
    }

    # Long cache for the hashed assets emitted by Vite.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # gzip text-ish assets.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # SPA fallback — all non-file routes resolve to index.html so React Router works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
