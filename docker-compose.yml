# =====================================================================
# AI Image Generator — one-command stack.
#
#   docker compose up --build
#
# Then open http://localhost:8080 (or whatever WEB_PORT you set in .env).
#
# Required: a `.env` file at the project root containing:
#   OPENAI_API_KEY=sk-...
# Optional:
#   WEB_PORT=8080            # host port for the frontend
#   CORS_ORIGINS=...         # only needed if you talk to the API directly
# =====================================================================

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: img-gen-api:latest
    container_name: img-gen-api
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required — set it in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      DATA_DIR: /data
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Optional knobs — pass-through from your root .env if set.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      OWNER_USERNAME: ${OWNER_USERNAME:-owner}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      EMBEDDINGS_ENABLED: ${EMBEDDINGS_ENABLED:-true}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    volumes:
      - api_data:/data
    expose:
      - "8000"
    networks:
      - imggen
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: img-gen-web:latest
    container_name: img-gen-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - imggen

networks:
  imggen:
    driver: bridge

volumes:
  api_data:
    driver: local
